<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PixelTown 3D look test</title>
<style>
  :root { --ink: #4a3340; --panel: rgba(255, 250, 244, 0.92); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe6f2; font-family: "Trebuchet MS", "Segoe UI", sans-serif; }
  canvas { display: block; touch-action: none; }
  #paper { position: fixed; inset: 0; pointer-events: none; mix-blend-mode: multiply; opacity: 0; }
  #vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(80, 40, 60, 0.22) 100%); }
  .hud { position: fixed; top: 14px; display: flex; gap: 10px; }
  .hud.left { left: 14px; }
  .hud.right { right: 14px; flex-wrap: wrap; justify-content: flex-end; max-width: 70vw; }
  .chip, button { min-height: 64px; min-width: 64px; padding: 0 18px; border-radius: 22px; border: 3px solid #fff;
    background: var(--panel); color: var(--ink); font-size: 22px; font-weight: 700;
    box-shadow: 0 4px 0 rgba(120, 70, 90, 0.25), 0 8px 18px rgba(80, 40, 60, 0.18);
    display: flex; align-items: center; gap: 8px; box-sizing: border-box; }
  button { cursor: pointer; font-size: 17px; }
  button.on { background: #ffd6e7; border-color: #ff8fbf; }
  #bubble { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); padding: 16px 26px; border-radius: 26px;
    background: var(--panel); color: var(--ink); font-size: 24px; font-weight: 700; border: 3px solid #fff;
    box-shadow: 0 8px 22px rgba(80, 40, 60, 0.2); transition: opacity .3s; max-width: 86vw; text-align: center; }
  @media (max-width: 700px) {
    .chip, button { min-height: 52px; min-width: 52px; padding: 0 12px; font-size: 15px; }
    #bubble { font-size: 18px; }
  }
</style>
</head>
<body>
<svg id="paper" width="100%" height="100%"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.85  0 0 0 0 0.78  0 0 0 0 0.7  0 0 0 0.9 0"/></filter><rect width="100%" height="100%" filter="url(#grain)"/></svg>
<div id="vignette"></div>
<div class="hud left"><div class="chip">⭐ 12</div><div class="chip">🎁 3</div></div>
<div class="hud right" id="styles"></div>
<div id="bubble">Tap the ground to walk. Tap a letter house!</div>
<script src="three.min.js"></script>
<script>
// A quick look test for a 3D, storybook-style PixelTown. Everything is built
// from simple shapes in code (no model files), lit with toon shading and drawn
// with an ink outline, seen from the same quarter-view angle as the game.
const params = new URLSearchParams(location.search);
const STYLES = {
  cartoon: {
    label: '🖍️ Cartoon', sky: ['#7cc8f5', '#d8f1ff'], sun: '#fff6e0', sunI: 1.75, hemi: ['#d6d0ff', '#b3aae6', 1.95],
    steps: [0, 1], ink: '#2a1a2e', line: 1.7, inkMix: 0.2, rim: 0.32, fog: ['#d8f1ff', 400, 500],
    grass: ['#79cc5a', '#6cbf4f', '#8bd968'], night: false
  },
  anime: {
    label: '✨ Anime', sky: ['#8fd6ff', '#fff0f6'], sun: '#fff8ea', sunI: 1.6, hemi: ['#e2dcff', '#bdb3ec', 2.0],
    steps: [0, 0.55, 1], ink: '#3a2440', line: 1.15, inkMix: 0.65, rim: 0.5, fog: ['#fff0f6', 400, 500],
    grass: ['#8ad86a', '#7ccb5c', '#9fe27c'], night: false
  },
  night: {
    label: '🌙 Winter night', sky: ['#1b2350', '#5b4d86'], sun: '#a9c0ff', sunI: 1.7, hemi: ['#8f95e0', '#5a5aa0', 1.8],
    steps: [0, 1], ink: '#120e26', line: 1.7, inkMix: 0.2, rim: 0.4, fog: ['#3a3d70', 400, 500],
    grass: ['#e8eef8', '#dbe4f2', '#f4f7fc'], night: true
  }
};
STYLES.storybook = STYLES.cartoon; // older links
for (const k in STYLES) STYLES[k].thick = 0; // screen-space lines replace the old hull outline
const styleName = STYLES[params.get('style')] && params.get('style') !== 'storybook' ? params.get('style') : 'cartoon';
const S = STYLES[styleName];
const heroKind = params.get('hero') === 'captain' ? 'captain' : 'princess';

// Style and hero switches (big buttons for small fingers).
const bar = document.getElementById('styles');
function link(label, on, q) {
  const b = document.createElement('button');
  b.textContent = label; if (on) b.className = 'on';
  b.onclick = () => { const p = new URLSearchParams(location.search); for (const k in q) p.set(k, q[k]); location.search = p.toString(); };
  bar.appendChild(b);
}
for (const k of ['cartoon', 'anime', 'night']) link(STYLES[k].label, k === styleName, { style: k });
link(heroKind === 'princess' ? '🤖 Captain' : '👑 Princess', false, { hero: heroKind === 'princess' ? 'captain' : 'princess' });
document.getElementById('paper').style.opacity = 0;
document.getElementById('vignette').style.display = 'none';

// Renderer, scene and quarter-view camera.
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(S.fog[0], S.fog[1], S.fog[2]);

function gradientTexture(a, b) {
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, a); gr.addColorStop(1, b); g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
scene.background = gradientTexture(S.sky[0], S.sky[1]);

const VIEW = 32 / (+params.get('zoom') || 1); // world units visible vertically
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 400);
const camOffset = new THREE.Vector3(60, 52, 60);
function resize() {
  const w = innerWidth, h = innerHeight, a = w / h;
  const v = a < 1 ? VIEW * 1.25 : VIEW;
  camera.left = -v * a / 2; camera.right = v * a / 2; camera.top = v / 2; camera.bottom = -v / 2;
  camera.updateProjectionMatrix(); renderer.setSize(w, h);
}
addEventListener('resize', resize); resize();

// Ink lines: render normals and depth, then draw a line wherever either jumps.
// This gives every silhouette and crease the same pen width on screen.
const normalMat = new THREE.MeshNormalMaterial();
let colorRT, normalRT;
const post = new THREE.ShaderMaterial({
  uniforms: { tColor: { value: null }, tNormal: { value: null }, tDepth: { value: null }, res: { value: new THREE.Vector2() },
    ink: { value: new THREE.Color(S.ink) }, width: { value: 1 }, inkMix: { value: S.inkMix } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: `
    uniform sampler2D tColor, tNormal, tDepth; uniform vec2 res; uniform vec3 ink; uniform float width, inkMix;
    varying vec2 vUv;
    float edgeAt(vec2 o) {
      vec2 a = vUv + o / res, b = vUv - o / res;
      float d = abs(texture2D(tDepth, a).r - texture2D(tDepth, b).r) * 400.0;
      vec3 na = texture2D(tNormal, a).rgb * 2.0 - 1.0, nb = texture2D(tNormal, b).rgb * 2.0 - 1.0;
      float n = 1.0 - dot(normalize(na), normalize(nb));
      return max(smoothstep(0.35, 0.6, d), smoothstep(0.25, 0.45, n));
    }
    void main() {
      vec4 c = texture2D(tColor, vUv);
      float e = 0.0;
      e = max(e, edgeAt(vec2(width, 0.0)));
      e = max(e, edgeAt(vec2(0.0, width)));
      e = max(e, edgeAt(vec2(width, width) * 0.7071));
      e = max(e, edgeAt(vec2(width, -width) * 0.7071));
      vec3 line = mix(ink, c.rgb * 0.35, inkMix);
      gl_FragColor = vec4(mix(c.rgb, line, e), 1.0);
      #include <colorspace_fragment>
    }`,
  depthTest: false, depthWrite: false
});
const postScene = new THREE.Scene(), postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post));
function makeTargets() {
  const r = renderer.getPixelRatio(), w = Math.round(innerWidth * r), h = Math.round(innerHeight * r);
  if (colorRT) { colorRT.dispose(); normalRT.dispose(); }
  colorRT = new THREE.WebGLRenderTarget(w, h, { samples: 4 }); colorRT.texture.colorSpace = THREE.SRGBColorSpace;
  normalRT = new THREE.WebGLRenderTarget(w, h); normalRT.depthTexture = new THREE.DepthTexture(w, h);
  Object.assign(post.uniforms, {});
  post.uniforms.tColor.value = colorRT.texture; post.uniforms.tNormal.value = normalRT.texture;
  post.uniforms.tDepth.value = normalRT.depthTexture; post.uniforms.res.value.set(w, h);
  post.uniforms.width.value = S.line * r * (w < 900 ? 0.8 : 1);
}
addEventListener('resize', makeTargets); makeTargets();
function draw() {
  const bg = scene.background;
  particles.visible = blob.visible = false; scene.background = null; scene.overrideMaterial = normalMat;
  renderer.setClearColor('#8080ff', 1); renderer.setRenderTarget(normalRT); renderer.render(scene, camera);
  particles.visible = blob.visible = true; scene.background = bg; scene.overrideMaterial = null;
  renderer.setRenderTarget(colorRT); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
}

// Lights.
const hemi = new THREE.HemisphereLight(S.hemi[0], S.hemi[1], S.hemi[2]);
scene.add(hemi);
const sun = new THREE.DirectionalLight(S.sun, S.sunI);
sun.position.set(-14, 50, 38);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 140 });
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.07;
scene.add(sun); scene.add(sun.target);

// Toon ramp: a few flat bands of light give the hand-painted cel look.
const ramp = new Uint8Array(S.steps.map(v => Math.round(v * 255)));
const gradientMap = new THREE.DataTexture(ramp, ramp.length, 1, THREE.RedFormat);
gradientMap.minFilter = gradientMap.magFilter = THREE.NearestFilter;
gradientMap.needsUpdate = true;

const mats = new Map();
function toon(color, extra) {
  const key = color + JSON.stringify(extra || {});
  if (!mats.has(key)) mats.set(key, rimmed(new THREE.MeshToonMaterial(Object.assign({ color, gradientMap }, extra || {}))));
  return mats.get(key);
}
// A hard rim of light along the edges facing away from the camera, a classic cel touch.
function rimmed(m) {
  m.onBeforeCompile = sh => {
    sh.fragmentShader = sh.fragmentShader.replace('#include <opaque_fragment>',
      'float rimF = 1.0 - max(dot(normal, vec3(0.0, 0.0, 1.0)), 0.0);\n' +
      'outgoingLight += diffuseColor.rgb * ' + S.rim.toFixed(2) + ' * smoothstep(0.66, 0.7, rimF);\n#include <opaque_fragment>');
  };
  return m;
}

// Ink outline: draw the back faces pushed out along smoothed normals.
const outlineMat = new THREE.ShaderMaterial({
  uniforms: { color: { value: new THREE.Color(S.outline) }, thick: { value: S.thick } },
  vertexShader: 'uniform float thick; attribute vec3 snormal; void main(){ vec3 p = position + snormal * thick; gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0); }',
  fragmentShader: 'uniform vec3 color; void main(){ gl_FragColor = vec4(color, 1.0); \n#include <colorspace_fragment>\n }',
  side: THREE.BackSide
});
function smoothNormals(geo) {
  if (geo.getAttribute('snormal')) return;
  const pos = geo.getAttribute('position'), nor = geo.getAttribute('normal');
  const sum = new Map(), key = i => pos.getX(i).toFixed(3) + ',' + pos.getY(i).toFixed(3) + ',' + pos.getZ(i).toFixed(3);
  for (let i = 0; i < pos.count; i++) {
    const k = key(i), s = sum.get(k) || [0, 0, 0];
    s[0] += nor.getX(i); s[1] += nor.getY(i); s[2] += nor.getZ(i); sum.set(k, s);
  }
  const out = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) {
    const s = sum.get(key(i)), l = Math.hypot(s[0], s[1], s[2]) || 1;
    out[i * 3] = s[0] / l; out[i * 3 + 1] = s[1] / l; out[i * 3 + 2] = s[2] / l;
  }
  geo.setAttribute('snormal', new THREE.BufferAttribute(out, 3));
}
function mesh(geo, color, opt = {}) {
  const m = new THREE.Mesh(geo, opt.material || toon(color, opt.mat));
  m.castShadow = opt.cast !== false; m.receiveShadow = true;
  if (opt.outline !== false && S.thick > 0) {
    smoothNormals(geo);
    const o = new THREE.Mesh(geo, outlineMat); o.castShadow = false; o.raycast = () => {};
    m.add(o);
  }
  if (opt.at) m.position.set(...opt.at);
  if (opt.rot) m.rotation.set(...opt.rot);
  return m;
}
const put = (parent, m) => (parent.add(m), m);
const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();

// Painterly ground texture: soft blotches of a few greens (or snow).
function blotchTexture(colors, size, blobs, repeat) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); g.fillStyle = colors[0]; g.fillRect(0, 0, size, size);
  for (let i = 0; i < blobs; i++) {
    const x = rnd() * size, y = rnd() * size, r = 6 + rnd() * 26;
    g.fillStyle = colors[1 + (i % (colors.length - 1))];
    g.beginPath(); g.ellipse(x, y, r, r * 0.6, rnd() * 3, 0, 7); g.fill();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat); t.anisotropy = 4;
  return t;
}
function cobbleTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = S.night ? '#b9bdd6' : '#dcc3b6'; g.fillRect(0, 0, 256, 256);
  const tones = S.night ? ['#dfe3f0', '#d2d6e8', '#e8ebf5'] : ['#f6e7dc', '#efd8cc', '#f3e1d8', '#e8cfc6'];
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
    const ox = (y % 2) * 16;
    g.fillStyle = tones[(x * 3 + y * 5) % tones.length];
    g.beginPath(); g.roundRect(x * 32 + ox + 2 + rnd() * 2, y * 32 + 2 + rnd() * 2, 27, 27, 9); g.fill();
    g.lineWidth = 2.5; g.strokeStyle = S.night ? '#a9aecb' : '#cfb3a6'; g.stroke();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(5, 5); t.anisotropy = 4;
  return t;
}

// Ground, plaza and paths.
const ground = mesh(new THREE.PlaneGeometry(220, 220), null,
  { material: new THREE.MeshToonMaterial({ map: blotchTexture(S.grass, 512, 70, 6), gradientMap }), outline: false, cast: false });
ground.rotation.x = -Math.PI / 2; ground.name = 'ground'; scene.add(ground);
const cobble = new THREE.MeshToonMaterial({ map: cobbleTexture(), gradientMap });
const plaza = mesh(new THREE.CylinderGeometry(9, 9, 0.12, 48), null, { material: cobble, outline: false, cast: false, at: [1, 0.06, 3] });
scene.add(plaza);
function path(x, z, w, d) {
  const p = mesh(new THREE.BoxGeometry(w, 0.1, d), null, { material: cobble, outline: false, cast: false, at: [x, 0.05, z] });
  scene.add(p); return p;
}
path(-4, -6, 3.4, 10); path(12, 3, 10, 2.6); path(1, 15, 2.6, 8); path(-11, 6, 9, 2.6);

// Castle.
const C = S.night
  ? { wall: '#e6e2f2', trim: '#cfc8e6', roof: '#e86aa6', roof2: '#c88ae6', gold: '#ffd86b', glass: '#ffd88a' }
  : { wall: '#fbf1f4', trim: '#efdbe3', roof: '#f47fb1', roof2: '#b99af0', gold: '#f6c64f', glass: '#9fd1ff' };
const glassOpt = S.night ? { mat: { emissive: '#ffc766', emissiveIntensity: 1.1 } } : {};
function tower(g, x, z, r, h, roof) {
  put(g, mesh(new THREE.CylinderGeometry(r, r * 1.05, h, 20), C.wall, { at: [x, h / 2, z] }));
  put(g, mesh(new THREE.CylinderGeometry(r * 1.15, r * 1.15, 0.5, 20), C.trim, { at: [x, h + 0.25, z] }));
  put(g, mesh(new THREE.ConeGeometry(r * 1.35, h * 0.62, 20), roof, { at: [x, h + 0.5 + h * 0.31, z] }));
  put(g, mesh(new THREE.SphereGeometry(r * 0.18, 10, 8), C.gold, { at: [x, h + 0.5 + h * 0.62 + 0.1, z], outline: false }));
  const flag = mesh(new THREE.PlaneGeometry(1.3, 0.7), '#ff6f9f', { outline: false, at: [x + 0.65, h + h * 0.62 + 1.4, z], mat: { side: THREE.DoubleSide } });
  put(g, mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.6, 6), '#8a6a5a', { outline: false, at: [x, h + h * 0.62 + 1.1, z] }));
  flag.userData.wave = true; put(g, flag);
  for (let i = 0; i < 2; i++) {
    const a = Math.PI / 4 + i * 0.9;
    const w = mesh(new THREE.BoxGeometry(0.42, 0.9, 0.2), C.glass, Object.assign({ outline: false, at: [x + Math.cos(a) * r, h * (0.45 + i * 0.25), z + Math.sin(a) * r], rot: [0, -a + Math.PI / 2, 0] }, glassOpt));
    put(g, w);
  }
}
function castle() {
  const g = new THREE.Group();
  put(g, mesh(new THREE.BoxGeometry(12, 7, 7), C.wall, { at: [0, 3.5, 0] }));
  put(g, mesh(new THREE.BoxGeometry(12.4, 0.4, 7.4), C.trim, { at: [0, 7.2, 0] }));
  for (let i = 0; i < 9; i++) {
    put(g, mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), C.wall, { at: [-5.6 + i * 1.4, 7.8, 3.5] }));
    put(g, mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), C.wall, { at: [6, 7.8, -3 + i * 0.75] }));
  }
  put(g, mesh(new THREE.BoxGeometry(7, 5, 5), C.wall, { at: [0, 9.5, -0.5] }));
  put(g, mesh(new THREE.ConeGeometry(5, 4, 4), C.roof2, { at: [0, 14, -0.5], rot: [0, Math.PI / 4, 0] }));
  tower(g, -6, 3.5, 1.7, 9.5, C.roof); tower(g, 6, 3.5, 1.7, 9.5, C.roof);
  tower(g, -6, -3.5, 1.5, 8, C.roof2); tower(g, 6, -3.5, 1.5, 8, C.roof2);
  tower(g, 0, -1, 1.4, 15.5, C.roof);
  // Gate with a round arch, wooden doors and a gold trim.
  put(g, mesh(new THREE.BoxGeometry(3.2, 3.2, 0.3), '#8a5a44', { at: [0, 1.6, 3.55] }));
  put(g, mesh(new THREE.CylinderGeometry(1.6, 1.6, 0.3, 24, 1, false, 0, Math.PI), '#8a5a44', { at: [0, 3.2, 3.55], rot: [Math.PI / 2, 0, Math.PI / 2] }));
  put(g, mesh(new THREE.TorusGeometry(1.75, 0.18, 8, 24, Math.PI), C.gold, { at: [0, 3.2, 3.62], outline: false }));
  for (const x of [-4, -2.4, 2.4, 4]) {
    put(g, mesh(new THREE.BoxGeometry(0.8, 1.6, 0.2), C.glass, Object.assign({ at: [x, 4.6, 3.55], outline: false }, glassOpt)));
    put(g, mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.2, 16, 1, false, 0, Math.PI), C.glass, Object.assign({ at: [x, 5.4, 3.55], rot: [Math.PI / 2, 0, Math.PI / 2], outline: false }, glassOpt)));
  }
  for (const z of [-1.5, 1.5]) put(g, mesh(new THREE.BoxGeometry(0.2, 1.6, 0.8), C.glass, Object.assign({ at: [6.05, 4.6, z], outline: false }, glassOpt)));
  // Banners.
  for (const x of [-1.9, 1.9]) put(g, mesh(new THREE.BoxGeometry(0.7, 2, 0.08), '#ff8fbf', { at: [x, 4.4, 3.62], outline: false }));
  // Steps.
  for (let i = 0; i < 3; i++) put(g, mesh(new THREE.BoxGeometry(4.5 - i * 0.4, 0.25, 1), C.trim, { at: [0, 0.125 + i * 0.25, 4.6 - i * 0.5], outline: false }));
  g.position.set(-5, 0, -12); g.name = 'castle';
  return g;
}
scene.add(castle());

// Letter houses with a round sign the child can tap.
function letterTexture(letter, color) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#fffaf2'; g.beginPath(); g.arc(128, 128, 124, 0, 7); g.fill();
  g.lineWidth = 16; g.strokeStyle = color; g.beginPath(); g.arc(128, 128, 112, 0, 7); g.stroke();
  g.fillStyle = color; g.font = 'bold 170px "Trebuchet MS", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(letter, 128, 140);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
const houses = [];
function house(letter, color, roof, x, z, turn, word) {
  const g = new THREE.Group();
  const wall = S.night ? '#f1ece6' : '#fff6e8';
  put(g, mesh(new THREE.BoxGeometry(4.4, 3.2, 4), wall, { at: [0, 1.6, 0] }));
  // Timber frame strips.
  for (const x2 of [-2.2, 2.2]) put(g, mesh(new THREE.BoxGeometry(0.25, 3.2, 0.25), '#b07a5a', { at: [x2, 1.6, 2], outline: false }));
  put(g, mesh(new THREE.BoxGeometry(4.6, 0.25, 0.25), '#b07a5a', { at: [0, 3.1, 2.02], outline: false }));
  // A triangular prism lying along z gives a gable facing the plaza.
  const roofGeo = new THREE.CylinderGeometry(2.9, 2.9, 5.0, 3); roofGeo.rotateX(-Math.PI / 2);
  const r = mesh(roofGeo, roof, { at: [0, 4.3, 0] }); r.scale.set(1, 0.75, 1); put(g, r);

const clock = new THREE.Clock();

    else p.setY(i, p.getY(i) + Math.sin(t * 1.3 + i) * dt * 0.2);

  const focus = params.get('zoom') ? new THREE.Vector3(hero.position.x, 1.5, hero.position.z) : new THREE.Vector3(hero.position.x * 0.6, 0, hero.position.z * 0.6 - 5.5);

}
