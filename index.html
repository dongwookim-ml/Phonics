<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="build" content="202610252102">
  <title>PixelTown</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=202610252102">
</head>
<body>
  <!-- The HD-2D finish (tilt-shift, bloom, vignette) is drawn in the canvas,
       under the signs and bubbles (drawFinish in js/game.js). -->
  <canvas id="game"></canvas>

  <header class="hud">
    <div class="counters">
      <div id="stars" class="stars"><span>⭐</span><span class="count">0</span></div>
      <div id="coins" class="stars coins hidden" title="코인"><span>🪙</span><span class="count">0</span></div>
      <div id="dust" class="stars dust hidden" title="요정의 가루"><span>✨</span><span class="count">0</span></div>
    </div>
    <nav class="buttons">
      <button id="ride" class="btn hidden" title="유니콘 타기/내리기">🦄</button>
      <button id="mute" class="btn" title="소리 켜기/끄기">🔊</button>
      <button id="parent" class="btn" title="부모 패널">⚙️</button>
    </nav>
  </header>

  <div id="place" class="place"></div>
  <div id="fade" class="fade"></div>

  <section id="dialog" class="dialog hidden">
    <div class="portrait"><canvas id="dlg-portrait"></canvas></div>
    <!-- A monster she drew herself shows her drawing here instead (js/kid-monsters.js). -->
    <button id="dlg-drawing" class="drawing hidden" type="button" title="크게 보기">
      <span class="photo"><img id="dlg-drawing-img" alt=""><span id="dlg-drawing-by" class="by"></span></span>
    </button>
    <div class="body">
      <div id="dlg-name" class="name"></div>
      <div id="dlg-text" class="text"></div>
      <div id="dlg-clue" class="clue hidden"></div>
      <div id="dlg-choices" class="choices"></div>
      <button id="dlg-books" class="dlg-books hidden">📖 책 읽어주세요</button>
      <button id="dlg-mini" class="dlg-books hidden">🎣 낚시 놀이</button>
    </div>
    <div class="side">
      <button id="dlg-replay" class="round" title="다시 듣기">🔊</button>
      <button id="dlg-close" class="round small" title="닫기">✖</button>
    </div>
  </section>

  <!-- Her drawing, big, until any tap (js/kid-monsters.js). -->
  <div id="drawing-big" class="drawing-big hidden">
    <figure><img id="drawing-big-img" alt=""><figcaption id="drawing-big-by"></figcaption></figure>
  </div>

  <section id="reward" class="reward hidden">
    <div id="rw-title" class="title"></div>
    <div id="rw-name" class="gift"></div>
    <div class="previews">
      <figure><canvas id="pv-now"></canvas><figcaption>지금</figcaption></figure>
      <div class="arrow">➜</div>
      <figure class="new"><canvas id="pv-new"></canvas><figcaption>바꾸면</figcaption></figure>
      <!-- The robot edition magnifies the part that changes (js/captain-hero.js). -->
      <figure class="zoom hidden"><canvas id="pv-zoom"></canvas><figcaption>🔍</figcaption></figure>
    </div>
    <div class="answer">
      <button id="rw-yes" class="yes">바꿀래요 💖</button>
      <button id="rw-no" class="no">그대로 할래요</button>
    </div>
  </section>

  <section id="wardrobe" class="wardrobe hidden">
    <div class="wd-head">
      <div id="wd-title" class="wd-name">🎀 공주님의 옷장</div>
      <div id="wd-count" class="wd-count"></div>
    </div>
    <!-- A picture tab for each kind of thing (js/game.js renderWardrobe). -->
    <div id="wd-tabs" class="wd-tabs"></div>
    <div class="wd-main">
      <div class="wd-mirror"><canvas id="wd-preview"></canvas></div>
      <div id="wd-slots" class="wd-slots"></div>
    </div>
    <button id="wd-done" class="wd-done">다 입었어요 ✨</button>
  </section>

  <section id="shop" class="wardrobe shop hidden">
    <div class="wd-head">
      <div class="wd-name">🛍️ 별빛 상점</div>
      <div id="shop-coins" class="wd-count"></div>
    </div>
    <div id="shop-msg" class="shop-msg"></div>
    <div id="shop-tabs" class="wd-tabs"></div>
    <div class="wd-main">
      <div class="wd-mirror"><canvas id="shop-preview"></canvas></div>
      <div id="shop-items" class="shop-items"></div>
    </div>
    <div class="answer">
      <button id="shop-buy" class="yes">살래요</button>
      <button id="shop-done" class="no">나갈래요 👋</button>
    </div>
  </section>

  <section id="library" class="wardrobe library hidden">
    <div class="wd-head">
      <div class="wd-name">📚 왕실 도서관</div>
      <div id="lib-count" class="wd-count"></div>
    </div>
    <div id="lib-books" class="lib-books"></div>
    <button id="lib-done" class="wd-done">나갈래요 👋</button>
  </section>

  <section id="reader" class="reader hidden">
    <div class="rd-head">
      <div id="rd-title" class="rd-title"></div>
      <div id="rd-pageno" class="rd-pageno"></div>
      <button id="rd-close" class="round small" title="닫기">✖</button>
    </div>
    <div id="rd-paper" class="rd-paper">
      <div id="rd-page" class="rd-page">
        <div id="rd-pic" class="rd-pic"></div>
        <div id="rd-text" class="rd-text" lang="en"></div>
      </div>
      <div id="rd-quiz" class="rd-quiz hidden" lang="en">
        <div id="rd-q" class="rd-q"></div>
        <div id="rd-options" class="rd-options"></div>
      </div>
    </div>
    <div id="rd-nav" class="rd-nav">
      <button id="rd-prev" class="rd-btn" title="앞 장">◀</button>
      <button id="rd-play" class="rd-btn play" title="잠깐 멈춰요">⏸</button>
      <button id="rd-next" class="rd-btn" title="다음 장">▶</button>
    </div>
  </section>

  <!-- Feeding her fairy friend (js/friend.js). -->
  <section id="feed" class="reward feed hidden">
    <div id="fd-title" class="title"></div>
    <canvas id="fd-friend"></canvas>
    <div id="fd-pips" class="fd-pips"></div>
    <div id="fd-note" class="fd-note"></div>
    <div class="answer">
      <button id="fd-jar" class="yes" title="주기"></button>
      <button id="fd-done" class="no" title="다 했어요">👋</button>
    </div>
  </section>

  <!-- The little games: fishing at the pond, one in each village (js/minigame.js, js/village-games.js). -->
  <section id="mini" class="mini hidden">
    <div class="mini-head">
      <div id="mini-title" class="mini-title"></div>
      <button id="mini-letter" class="mini-letter" title="다시 듣기"></button>
      <div id="mini-pips" class="mini-pips"></div>
      <button id="mini-replay" class="round" title="다시 듣기">🔊</button>
      <button id="mini-close" class="round small" title="닫기">✖</button>
    </div>
    <canvas id="mini-canvas"></canvas>
    <div id="mini-end" class="mini-end hidden">
      <div id="mini-catch" class="mini-catch"></div>
      <!-- The letters she knows, after the Unicorn Village's game at the one-sound step (js/village-games.js). -->
      <div id="mini-letters" class="mini-letters hidden"></div>
      <div id="mini-two" class="ml-two hidden"></div>
      <div id="mini-coins" class="mini-coins"></div>
      <div class="answer">
        <button id="mini-again" class="yes">🔁</button>
        <button id="mini-bye" class="no">👋</button>
      </div>
    </div>
  </section>

  <!-- The play-time limit: the town sleeps until a parent wakes it (js/guide.js). -->
  <div id="sleep" class="sleep hidden">
    <div class="moon">🌙</div>
    <div class="zz">💤</div>
    <div class="msg">마을이 잠들었어요. 내일 또 만나요!</div>
    <button id="sleep-key" class="sleep-key" type="button">🔑 부모님</button>
    <form id="sleep-form" class="sleep-form hidden">
      <input id="sleep-pw" type="password" class="sleep-pw" autocomplete="current-password" placeholder="비밀번호">
      <button type="submit" class="sleep-go">계속 놀기</button>
      <p id="sleep-err" class="sleep-err"></p>
    </form>
  </div>

  <div id="start" class="start">
    <div id="account-bar" class="account-bar"></div>
    <canvas id="start-preview" class="preview"></canvas>
    <h1><span id="start-title">윤아 공주의</span><br><span id="start-game" class="gold">소리 마을</span></h1>
    <div class="profile">
      <label class="field">
        <span>이름</span>
        <input id="name-input" maxlength="10" autocomplete="off" placeholder="윤아">
      </label>
      <label class="field">
        <span>영어로 부를 때</span>
        <input id="spoken-input" maxlength="20" autocomplete="off" placeholder="Yuna" lang="en">
        <button id="hear-name" class="round small" type="button" title="들어보기">🔊</button>
      </label>
      <div id="title-chips" class="title-chips"></div>
      <div id="look-chips" class="title-chips"></div>
    </div>
    <button id="start-btn" class="start-btn">▶</button>
    <p class="tip">마을 사람을 누르면 단어를 들려줘요 · 집을 누르면 안으로 들어가요</p>
  </div>

  <!-- A newer build is out (js/update.js). -->
  <div id="update" class="update hidden" role="alert">
    <span class="ic">✨</span><span class="msg">새로운 버전이 나왔어요!</span>
    <button type="button">새로고침 🔄</button>
  </div>

  <!-- Login / sign-up, shown before the start screen (js/account.js). -->
  <div id="login" class="start login hidden">
    <h1><span id="login-icon">🏰</span><br><span id="login-game" class="gold">소리 마을</span></h1>
    <div class="login-edition">
      <button class="edition" data-edition="princess" type="button"><span class="ic">👸</span>공주</button>
      <button class="edition" data-edition="captain" type="button"><span class="ic">🤖</span>캡틴</button>
    </div>
    <div class="profile">
      <div class="login-tabs">
        <button class="chip on" data-tab="login" type="button">로그인</button>
        <button class="chip" data-tab="signup" type="button">회원가입</button>
      </div>
      <label class="field">
        <span>아이디</span>
        <input id="login-id" maxlength="20" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" lang="en" inputmode="email">
      </label>
      <label class="field">
        <span>비밀번호</span>
        <input id="login-pw" type="password" maxlength="200" autocomplete="current-password">
      </label>
      <div id="login-msg" class="login-msg"></div>
      <button id="login-go" class="login-go" type="button">로그인 🔑</button>
    </div>
    <button id="login-guest" class="login-guest" type="button">계정 없이 할래요</button>
  </div>

  <script src="js/data.js?v=202610252102"></script>
  <script src="js/progress.js?v=202610252102"></script>
  <script src="js/account.js?v=202610252102"></script>
  <script src="audio/tts/index.js?v=202610252102"></script>
  <script src="js/audio.js?v=202610252102"></script>
  <script src="js/music.js?v=202610252102"></script>
  <script src="js/sprites.js?v=202610252102"></script>
  <script src="js/world.js?v=202610252102"></script>
  <script src="js/monster-village.js?v=202610252102"></script>
  <script src="js/touch.js?v=202610252102"></script>
  <script src="js/quiz.js?v=202610252102"></script>
  <script src="js/books.js?v=202610252102"></script>
  <script src="js/library.js?v=202610252102"></script>
  <script src="js/album.js?v=202610252102"></script>
  <script src="js/captain-hero.js?v=202610252102"></script>
  <script src="js/captain-town.js?v=202610252102"></script>
  <script src="js/captain-dino.js?v=202610252102"></script>
  <script src="js/captain-drone.js?v=202610252102"></script>
  <script src="js/captain-car.js?v=202610252102"></script>
  <script src="js/captain-cave.js?v=202610252102"></script>
  <script src="js/cave-magic.js?v=202610252102"></script>
  <script src="js/kid-monsters.js?v=202610252102"></script>
  <script src="js/friend.js?v=202610252102"></script>
  <script src="js/minigame.js?v=202610252102"></script>
  <script src="js/village-games.js?v=202610252102"></script>
  <script src="js/blend-magic.js?v=202610252102"></script>
  <script src="js/guide.js?v=202610252102"></script>
  <script src="js/quest.js?v=202610252102"></script>
  <script src="js/game.js?v=202610252102"></script>
  <script src="js/parent.js?v=202610252102"></script>
  <script src="js/update.js?v=202610252102"></script>
</body>
</html>
